name: refresh

on:
  schedule:
    - cron: "7 * * * *"   # every hour
  workflow_dispatch:

concurrency:
  group: play
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  hills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Draw Kigali right now
        run: python scripts/hills.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "refresh: $(TZ=Africa/Kigali date +%H:%M)"
          git pull --rebase
          git push
