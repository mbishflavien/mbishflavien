name: play

on:
  issues:
    types: [opened]

# One submission at a time, so two answers can't overwrite each other.
concurrency:
  group: play
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  play:
    if: startsWith(github.event.issue.title, 'ctf|')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check the flag
        run: python scripts/play.py
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          CTF_FLAGS: ${{ secrets.CTF_FLAGS }}
          REPLY_FILE: ${{ runner.temp }}/reply.md

      - name: Save the Hall of Hackers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "ctf: ${{ github.event.issue.user.login }}"
          git pull --rebase
          git push

      - name: Reply and close the issue
        run: |
          gh issue comment ${{ github.event.issue.number }} --body-file "$RUNNER_TEMP/reply.md"
          gh issue close ${{ github.event.issue.number }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
